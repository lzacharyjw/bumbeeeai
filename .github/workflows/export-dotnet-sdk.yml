name: Export .NET 8 Build Bundle

on:
  push:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Install isolated .NET 8 SDK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/dotnet"
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --version 8.0.424 --install-dir "$RUNNER_TEMP/dotnet" --no-path
          "$RUNNER_TEMP/dotnet/dotnet" --info

      - name: Restore WPF build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export DOTNET_ROOT="$RUNNER_TEMP/dotnet"
          export PATH="$DOTNET_ROOT:$PATH"
          export NUGET_PACKAGES="$RUNNER_TEMP/nuget-packages"
          mkdir -p "$RUNNER_TEMP/restore-probe"
          cat > "$RUNNER_TEMP/restore-probe/RestoreProbe.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net8.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <UseWindowsForms>true</UseWindowsForms>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <RuntimeIdentifiers>win-x64;win-x86</RuntimeIdentifiers>
              <SelfContained>true</SelfContained>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.Web.WebView2" Version="1.0.2792.45" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$RUNNER_TEMP/restore-probe/RestoreProbe.csproj" --packages "$NUGET_PACKAGES"

      - name: Download approved background
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 4 'https://developersaccess.com/uploads/domains/samZCvmTwyAQZVcZksJfmdtnKXp0rkfF.webp' --output "$RUNNER_TEMP/approved-weedleaf.webp"
          test -s "$RUNNER_TEMP/approved-weedleaf.webp"
          sha256sum "$RUNNER_TEMP/approved-weedleaf.webp"

      - name: Package build bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/build-bundle"
          mv "$RUNNER_TEMP/dotnet" "$RUNNER_TEMP/build-bundle/dotnet"
          mv "$RUNNER_TEMP/nuget-packages" "$RUNNER_TEMP/build-bundle/nuget-packages"
          cp "$RUNNER_TEMP/approved-weedleaf.webp" "$RUNNER_TEMP/build-bundle/approved-weedleaf.webp"
          tar -C "$RUNNER_TEMP" -czf dotnet8-wpf-build-bundle.tar.gz build-bundle
          ls -lh dotnet8-wpf-build-bundle.tar.gz

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: dotnet8-wpf-build-bundle
          path: dotnet8-wpf-build-bundle.tar.gz
          compression-level: 0
          retention-days: 1
